
# Settings for Backend (on Cloud Run).
runConfig:
  minInstances: 0

# Set the service account for the backend.
serviceAccount: firebase-adminsdk-fbsvc@studio-1725493862-5cb95.iam.gserviceaccount.com

# Environment variables.
env:
  - variable: GEMINI_API_KEY
    value: "YOUR_GEMINI_API_KEY_HERE" # Set this in Firebase Console App Hosting Settings
  - variable: NEXT_PUBLIC_BASE_URL
    value: "https://goearnvid.shop"
  - variable: PAYPAL_ENVIRONMENT
    value: "live"
  - variable: NEXT_PUBLIC_TIKTOK_CLIENT_KEY
    value: "YOUR_TIKTOK_CLIENT_KEY_HERE"
  - variable: ADMIN_WHATSAPP_API_URL
    value: "YOUR_WHATSAPP_API_URL_HERE" # e.g. https://api.callmebot.com/whatsapp.php?phone=254xxx&apikey=xxx
