# ─────────────────────────────────────────────────────────────────────────────
# social.vidnov.com — ISOLATED nginx virtual host for Postiz.
#
# This file does NOT touch the existing vidnov.com / goearnvid site config.
# Install (root, on the VPS):
#   1. cp social.vidnov.com.conf /etc/nginx/sites-available/social.vidnov.com
#   2. ln -s /etc/nginx/sites-available/social.vidnov.com /etc/nginx/sites-enabled/
#   3. nginx -t            # must be successful BEFORE any reload
#   4. systemctl reload nginx
#   5. HTTPS (adds the 443 block + redirect automatically):
#      certbot --nginx -d social.vidnov.com
#   6. nginx -t && systemctl reload nginx
#
# Proxy target: 127.0.0.1:4007 (Postiz loopback port — never exposed publicly).
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name social.vidnov.com;

    # Media uploads (post images/videos) — keep well below Vidnov's 100m.
    client_max_body_size 50m;

    # Security headers for the marketing console.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:4007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # websockets (Postiz docs)
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Postiz queues long work; give slow scheduling calls room.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # After `certbot --nginx -d social.vidnov.com` runs, certbot manages the
    # 443 server block and the HTTP→HTTPS redirect in this file. Do not hand
    # edit certbot's inserted blocks; re-run `certbot renew --dry-run` monthly.
}
