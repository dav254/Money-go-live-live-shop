# ─────────────────────────────────────────────────────────────────────────────
# Vidnov × Postiz — isolated deployment stack
#
# Project name : vidnov-postiz   (docker compose -p isolation is set via `name:`)
# App port     : 127.0.0.1:4007 ONLY — public traffic arrives via nginx
#                (social.vidnov.com → proxy_pass http://127.0.0.1:4007)
# Secrets      : read from ./.env  (copy env.template → .env and fill in)
# Source       : adapted from the official gitroomhq/postiz-docker-compose,
#                with a PINNED app image and loopback-only publishing.
#
# This stack never touches the Vidnov app (PM2 "goearnvid", port 3000),
# its volumes, its database, or vidnov.com DNS.
# ─────────────────────────────────────────────────────────────────────────────

name: vidnov-postiz

services:
  # ── Postiz application (pinned) ────────────────────────────────────────────
  postiz:
    # Pinned release v2.25.3 (published 2026-10-24, linux/amd64 digest
    # sha256:3e2facf0c1ffdfe07b31cebdc5b850767721cb40a7a389dd07485f8e381bb49f).
    # To pin by digest instead: image: ghcr.io/gitroomhq/postiz-app@sha256:3e2fa…
    image: ghcr.io/gitroomhq/postiz-app:v2.25.3
    container_name: postiz
    restart: unless-stopped
    # All provider keys + optional email keys live in .env (see env.template).
    env_file: .env
    environment:
      # === Required settings ===
      MAIN_URL: 'https://social.vidnov.com'
      FRONTEND_URL: 'https://social.vidnov.com'
      NEXT_PUBLIC_BACKEND_URL: 'https://social.vidnov.com/api'
      JWT_SECRET: '${POSTIZ_JWT_SECRET:?POSTIZ_JWT_SECRET missing — generate one, see env.template}'
      DATABASE_URL: 'postgresql://${POSTIZ_PG_USER:-postiz}:${POSTIZ_PG_PASSWORD:?POSTIZ_PG_PASSWORD missing — see env.template}@postiz-postgres:5432/${POSTIZ_PG_DB:-vidnov_postiz}'
      REDIS_URL: 'redis://postiz-redis:6379'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      TEMPORAL_ADDRESS: 'temporal:7233'
      IS_GENERAL: 'true'
      # Registration: keep true ONLY for the first-run owner signup,
      # then set POSTIZ_DISABLE_REGISTRATION=true and recreate (README step 8).
      DISABLE_REGISTRATION: '${POSTIZ_DISABLE_REGISTRATION:-true}'
      RUN_CRON: 'true'
      # === Storage (local volume; R2 optional — see env.template) ===
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'
      # === Public API rate limit (posts/hour) ===
      API_LIMIT: '${POSTIZ_API_LIMIT:-30}'
    ports:
      # Loopback only — nothing on this port is reachable from the internet.
      - '127.0.0.1:4007:5000'
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    networks:
      - postiz-network
      - temporal-network
    healthcheck:
      test: ['CMD', 'node', '-e', "const r=require('http').get('http://localhost:5000/',res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_healthy

  # ── Postiz application database (internal only) ───────────────────────────
  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: '${POSTIZ_PG_USER:-postiz}'
      POSTGRES_PASSWORD: '${POSTIZ_PG_PASSWORD:?POSTIZ_PG_PASSWORD missing — see env.template}'
      POSTGRES_DB: '${POSTIZ_PG_DB:-vidnov_postiz}'
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTIZ_PG_USER:-postiz} -d ${POSTIZ_PG_DB:-vidnov_postiz}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Postiz queue/cache (internal only) ─────────────────────────────────────
  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

  # ── Temporal workflow stack (required by Postiz ≥ v2.12; internal) ────────
  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: unless-stopped
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - '9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: '${TEMPORAL_PG_PASSWORD:?TEMPORAL_PG_PASSWORD missing — see env.template}'
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data

  temporal:
    container_name: temporal
    restart: unless-stopped
    ports:
      - '127.0.0.1:7233:7233'
    image: temporalio/auto-setup:1.28.1
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_PG_PASSWORD:?TEMPORAL_PG_PASSWORD missing — see env.template}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', 'temporal:7233']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    restart: on-failure
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    depends_on:
      temporal:
        condition: service_healthy
    tty: true

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - temporal-network
    ports:
      # Loopback only — an internal debugging surface, never public.
      - '127.0.0.1:8080:8080'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      temporal:
        condition: service_healthy

volumes:
  postgres-volume:
    external: false
  postiz-redis-data:
    external: false
  postiz-config:
    external: false
  postiz-uploads:
    external: false
  temporal-postgres-data:
    external: false
  temporal-elasticsearch-data:
    external: false

networks:
  postiz-network:
    external: false
  temporal-network:
    driver: bridge
    name: temporal-network
